name: zzq-crossjob-0918
on: workflow_dispatch
jobs:
  jobb:
    runs-on: ubuntu-latest
    outputs:
      planid: ${{ steps.ids.outputs.planid }}
      jobid: ${{ steps.ids.outputs.jobid }}
    steps:
      - id: ids
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN;
            console.log("JOBB token present:", !!t, "len", t ? t.length : 0);
            console.log("JOBB ACTIONS_RESULTS_URL:", process.env.ACTIONS_RESULTS_URL);
            const c = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString());
            const scp = c.scp || "";
            console.log("JOBB scp:", scp);
            let plan = "", job = "";
            for (const p of scp.split(" ")) {
              if (p.startsWith("Actions.Results:")) { const a = p.split(":"); plan = a[1]; job = a[2]; }
            }
            console.log("JOBB plan:", plan, "job:", job);
            core.setOutput("planid", plan);
            core.setOutput("jobid", job);
  joba:
    needs: jobb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          B_PLAN: ${{ needs.jobb.outputs.planid }}
          B_JOB: ${{ needs.jobb.outputs.jobid }}
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN;
            const base = (process.env.ACTIONS_RESULTS_URL || "").replace(/\/$/, "");
            const c = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString());
            let plan = "", job = "";
            for (const p of (c.scp || "").split(" ")) {
              if (p.startsWith("Actions.Results:")) { const a = p.split(":"); plan = a[1]; job = a[2]; }
            }
            const bplan = process.env.B_PLAN, bjob = process.env.B_JOB;
            console.log("JOBA plan:", plan, "job:", job);
            console.log("JOBB plan:", bplan, "job:", bjob);
            console.log("SAME_PLAN:", plan === bplan, " DIFFERENT_JOB:", job !== bjob);
            console.log("RESULTS_URL:", base);
            const url = base + "/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts";
            async function call(label, rid, jid) {
              const body = JSON.stringify({ workflow_run_backend_id: rid, workflow_job_run_backend_id: jid });
              try {
                const r = await fetch(url, { method: "POST",
                  headers: { "Authorization": "Bearer " + t, "Content-Type": "application/json" },
                  body });
                const txt = (await r.text()).slice(0, 240);
                console.log("ARM " + label + " HTTP " + r.status + " :: " + txt);
              } catch (e) { console.log("ARM " + label + " EXC " + e.message); }
            }
            console.log("ARMS_BEGIN");
            await call("1_POSITIVE_CONTROL_own_job     ", plan, job);
            await call("2_CROSSJOB_same_run_jobB       ", plan, bjob);
            await call("3_NEG_CONTROL_bogus_jobid      ", plan, "00000000-0000-0000-0000-000000000000");
            console.log("ARMS_END");
