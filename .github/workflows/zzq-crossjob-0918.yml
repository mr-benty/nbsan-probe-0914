name: zzq-crossjob-0918
on: workflow_dispatch
jobs:
  jobb:
    runs-on: ubuntu-latest
    outputs:
      planid: ${{ steps.ids.outputs.planid }}
      jobid: ${{ steps.ids.outputs.jobid }}
    steps:
      - id: ids
        run: echo  | base64 -d > /tmp/b.py && python3 /tmp/b.py
  joba:
    needs: jobb
    runs-on: ubuntu-latest
    steps:
      - env:
          B_PLAN: ${{ needs.jobb.outputs.planid }}
          B_JOB: ${{ needs.jobb.outputs.jobid }}
        run: echo  | base64 -d > /tmp/a.py && python3 /tmp/a.py
